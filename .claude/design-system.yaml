# Design System — Centralizado
# Referenciado por todas as skills de frontend (skill07, skill09, skill10)
# Baseado no padrão PMZ com tokens detalhados e componentes reutilizáveis

version: "2.0.0"
last_updated: "2026-07-24"

# ============================================================================
# TOKENS — Fonte única de verdade
# ============================================================================
# Use estes valores em TODOS os componentes. Sem cores/tamanhos "soltos".

tokens:
  # Cores semânticas como tuplas (texto, fundo) para badges
  semantic:
    positive:
      text: "#166534"
      background: "#dcfce7"
      use: "melhora, Aprovado, Ativo"
    negative:
      text: "#991b1b"
      background: "#fee2e2"
      use: "piora, Rejeitado"
    warning:
      text: "#92400e"
      background: "#fef3c7"
      use: "Pendente, revisar"
    info:
      text: "#1e40af"
      background: "#dbeafe"
      use: "Simulado, tags neutras"
  
  # Tipografia dual (UI vs números)
  typography:
    ui_font: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    num_font: "monospace"
    num_variant: "tabular-nums"
    note: "SEMPRE use num_font com tabular-nums para números, preços, %, datas"
  
  # Raios
  radius:
    card: "0.375rem"
    control: "0.375rem"
    pill: "20px"
    chip: "6px"
  
  # Espaçamento
  spacing:
    page_x: "1.5rem"
    page_y: "1rem"
    card: "1rem"
    gap: "0.75rem"
  
  # Paleta categórica para gráficos (ordem fixa)
  chart_colorway:
    - "{primary}"  # será substituído pela cor primária do projeto
    - "#10b981"    # verde
    - "#f59e0b"    # âmbar
    - "#ef4444"    # vermelho
    - "#06b6d4"    # ciano
  
  # Mapa de status textual -> tipo semântico
  status_mapping:
    Aprovado: "positive"
    Ativo: "positive"
    Vigente: "positive"
    Rejeitado: "negative"
    Inativo: "negative"
    Pendente: "warning"
    "Pendente Aprovação": "warning"
    Simulado: "info"

colors:
  # Sidebar — light clean (branding dinâmico via .build/project.json)
  sidebar_bg: "#ffffff"           # branco — separado do page_bg por border-right
  sidebar_border: "#e2e8f0"       # slate-200
  sidebar_text: "#4b5563"         # gray-600 (inativo)
  sidebar_active_bg: "{primary}14" # 8% opacity da cor primária (gerado pelo frontend-builder)
  sidebar_active_text: "{primary}" # cor primária do cliente (gerado pelo frontend-builder)
  sidebar_footer: "#9ca3af"       # gray-400 — discreto
  
  # Page
  page_bg: "#f8fafc"              # slate-50
  
  # Cards
  card_bg: "#ffffff"
  card_border: "#e2e8f0"          # slate-200
  
  # Typography
  heading: "#1e293b"
  body_text: "#374151"
  muted: "#6b7280"
  
  # Semantic
  primary: "#1045C8"              # blue-500
  success: "#10b981"              # green-500
  warning: "#f59e0b"              # amber-500
  danger: "#ef4444"               # red-500
  info: "#06b6d4"                 # cyan-500
  secondary: "#6b7280"            # gray-500

typography:
  font_family: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  
  sizes:
    xs: "0.7rem"
    sm: "0.875rem"
    base: "1rem"
    lg: "1.125rem"
    xl: "1.25rem"
    "2xl": "1.5rem"
    "3xl": "1.875rem"
    "4xl": "2.25rem"
  
  weights:
    normal: 400
    medium: 500
    semibold: 600
    bold: 700

spacing:
  # Bootstrap spacing scale (rem)
  0: "0"
  1: "0.25rem"    # 4px
  2: "0.5rem"     # 8px
  3: "1rem"       # 16px
  4: "1.5rem"     # 24px
  5: "3rem"       # 48px

layout:
  sidebar:
    width: "240px"
    position: "fixed"
    z_index: 100
    
  content:
    margin_left: "240px"  # quando sidebar está visível
    min_height: "100vh"
    
  page_wrapper:
    padding: "1rem 1.5rem"  # py-3 px-4
    background: "#f8fafc"
    min_height: "100vh"

components:
  card:
    className: "shadow-sm border-0 mb-3"
    background: "#ffffff"
    border_radius: "0.375rem"  # rounded
    
  card_header:
    className: "bg-white border-bottom fw-semibold"
    padding: "0.75rem 1rem"
    font_size: "0.875rem"
    
  card_body:
    padding: "1rem"
    
  kpi_card:
    className: "shadow-sm border-0 border-start border-4 mb-3 h-100"
    border_colors:
      primary: "border-primary"
      success: "border-success"
      warning: "border-warning"
      danger: "border-danger"
      info: "border-info"
    
  filter_card:
    className: "shadow-sm border-0 mb-3"
    body_className: "py-2"
    row_className: "g-2 align-items-end"
    
  button:
    primary:
      color: "primary"
      className: "w-100"
    secondary:
      color: "secondary"
      className: ""
    
  badge:
    success: "success"
    warning: "warning"
    danger: "danger"
    secondary: "secondary"
    info: "info"

grid:
  ag_grid:
    theme: "ag-theme-alpine"
    height: "500px"
    
    default_col_def:
      resizable: true
      sortable: true
      filter: true
      floating_filter: true
      suppress_menu: true
      
    dash_grid_options:
      pagination: true
      pagination_page_size: 20
      pagination_page_size_selector: [10, 20, 50, 100]
      animate_rows: true
      row_height: 44
      header_height: 44
      row_selection: "multiple"
      
    csv_export:
      file_name_pattern: "<page>_export.csv"

charts:
  plotly:
    template: "plotly_white"
    paper_bgcolor: "rgba(0,0,0,0)"
    plot_bgcolor: "rgba(0,0,0,0)"
    height: 300
    
    margin:
      l: 20
      r: 20
      t: 40
      b: 20
      
    font:
      family: "system-ui, sans-serif"
      size: 12
      color: "#374151"
      
    config:
      display_mode_bar: false

forms:
  input:
    className: "form-control"
    
  select:
    className: "form-select"
    
  textarea:
    className: "form-control"
    rows: 3
    
  label:
    className: "form-label small text-muted"

naming_conventions:
  ids:
    page_grid: "<page>-grid"
    page_button_filter: "<page>-btn-filtrar"
    page_filter_field: "<page>-filtro-<campo>"
    page_filter_period: "<page>-filtro-periodo"
    page_chart: "<page>-chart-<tipo>"
    page_kpis_row: "<page>-kpis-row"
    page_button_action: "<page>-btn-<acao>"
    
  files:
    page: "<page>_page.py"
    components: "<page>_components.py"
    queries: "<page>_queries.py"
    callbacks: "<page>_callbacks.py"

restrictions:
  # Regras obrigatórias
  - "NUNCA usar dbc.Container como raiz do layout()"
  - "NUNCA usar dbc.Navbar dentro de páginas"
  - "SEMPRE usar html.Div com className='page-wrapper' como raiz"
  - "SEMPRE aplicar tipagem Python em todas as funções"
  - "NUNCA usar inline styles para cores (usar className ou design system)"
  - "SEMPRE usar IDs no padrão <page>-<component>"
  - "Página de login NÃO usa sidebar (fullscreen)"
  - "Fundo da página SEMPRE #f8fafc via style inline"

best_practices:
  - "Usar mb-3 para espaçamento vertical entre cards"
  - "Usar py-2, px-3 do Bootstrap para padding interno"
  - "KPI cards com borda lateral colorida (border-start border-4)"
  - "Filtros em card compacto no topo da página"
  - "AG Grid com floatingFilter ativo"
  - "Gráficos Plotly sem background (transparente)"
  - "Badges de status com cores semânticas"
  - "Botão filtrar com className='w-100' para ocupar coluna"
  - "SEMPRE usar app_shell() para estrutura de página"
  - "SEMPRE usar kpi_card() para KPIs com comparação atual×simulado"
  - "NUNCA mostrar valor solto sem baseline e delta"
  - "SEMPRE usar mono tabular para números em tabelas"
  - "SEMPRE usar badges coloridos para status (não texto simples)"

# ============================================================================
# BIBLIOTECAS DE COMPONENTES REUTILIZÁVEIS
# ============================================================================
# Copie estas bibliotecas para frontend/components/ em novos projetos

component_libraries:
  ui_components:
    source: ".claude/templates/components-library.py"
    destination: "frontend/components/ui_components.py"
    components:
      - "app_shell(active_key, icon_key, title, subtitle, content, actions)"
      - "kpi_card(label, atual, simulado, delta_pct, better)"
      - "kpi_row(cards)"
      - "data_table(df, id, numeric_cols, status_col, page_size)"
      - "page_header(icon_key, title, subtitle, actions)"
      - "card(title, body, right)"
      - "button(label, primary, icon_key)"
      - "filter_card(filters, button_id)"
      - "icon(icon_name, size)"
    helpers:
      - "status_badge_style(kind)"
      - "format_currency(value, decimals)"
      - "format_percent(value, decimals, with_sign)"
      - "format_number(value, decimals)"
    tokens:
      - "COLORS, CHART_COLORWAY, FONT_UI, FONT_NUM"
      - "RADIUS, SPACE, STATUS_KIND"
  
  charts:
    source: ".claude/templates/charts-library.py"
    destination: "frontend/components/charts.py"
    components:
      - "bar_ranking(labels, values, value_fmt, title, height)"
      - "bar_vertical(labels, values, title, height)"
      - "variation_bars(labels, pcts, title, height)"
      - "donut(labels, values, title, height, hole)"
      - "pie(labels, values, title, height)"
      - "line_chart(x, y, title, x_label, y_label, height)"
      - "multi_line_chart(x, series, title, x_label, y_label, height)"
      - "area_chart(x, y, title, x_label, y_label, height)"
      - "scatter_chart(x, y, title, x_label, y_label, height)"
      - "histogram(values, title, x_label, y_label, height, nbins)"
    helpers:
      - "set_primary_color(color)"
      - "get_empty_state_message(chart_type)"

# ============================================================================
# PRINCÍPIOS DE UX (do GUIA-VISUAL-PMZ.md)
# ============================================================================

ux_principles:
  - "O dado é o herói — layout existe para tornar números legíveis"
  - "Uma tela = um objetivo — cabeçalho diz o que é e o que fazer"
  - "Comparação em vez de valor solto — sempre mostrar baseline + delta"
  - "Cor com significado — verde=positivo, vermelho=negativo, âmbar=atenção"
  - "Densidade para uso profissional — tabelas compactas, KPIs generosos"
  - "Sem tela vazia e sem tela sufocada — respiro consistente"
  - "Estado sempre visível — badges coloridos, não texto simples"

# ============================================================================
# WORKFLOWS E NAVEGAÇÃO CONTEXTUAL
# ============================================================================

workflows:
  enabled: true
  storage_type: session  # session | local | database
  
  # Tokens de workflow
  tokens:
    step_completed:
      icon: "check-circle-fill"
      color: "#16a34a"  # verde
      text: "✓"
    step_current:
      icon: "circle-fill"
      color: "#1045c8"  # primário
      text: "●"
    step_pending:
      icon: "circle"
      color: "#94a3b8"  # cinza
      text: "○"
    breadcrumb_bg: "#f8fafc"
    breadcrumb_border: "#e2e8f0"
  
  # Categorias de workflow (metodologia Pricing & Revenue Management)
  categories:
    análise:
      description: "Diagnóstico e identificação de oportunidades"
      icon: "graph-up"
      color: "#1e40af"  # azul
    inovação:
      description: "Desenvolvimento de soluções e simulações"
      icon: "lightbulb"
      color: "#7c3aed"  # roxo
    implementação:
      description: "Execução de quick wins e planos de ação"
      icon: "play-circle"
      color: "#16a34a"  # verde
    controle:
      description: "Monitoramento contínuo e ajustes"
      icon: "speedometer2"
      color: "#ea580c"  # laranja
  
  # Componentes de workflow
  components:
    workflow_breadcrumb:
      description: "Breadcrumb visual mostrando progresso no fluxo"
      location: "topo da página, após header"
      style: "bg-light p-3 rounded mb-3 border"
      max_steps_visible: 5
    
    workflow_context_actions:
      description: "Botões de próximos passos contextuais"
      location: "junto com actions do page_header"
      style: "botões primary/outline-primary size sm"
      max_actions_visible: 3
    
    workflow_status_card:
      description: "Card lateral com status do workflow"
      location: "sidebar ou coluna direita"
      style: "shadow-sm border-0 mb-3"
      show_progress_bar: true
  
  # Regras de navegação contextual
  navigation:
    preserve_context: true  # manter context_data ao navegar
    track_history: true     # registrar histórico de navegação
    max_history_items: 10
    auto_save_context: true # salvar contexto automaticamente
    
    # Condições suportadas
    conditions:
      - "cenario_salvo"
      - "status_aprovacao == 'Aprovado'"
      - "status_aprovacao == 'Rejeitado'"
      - "desvios_identificados > 0"
      - "plano_criado"
  
  # Integração com app.py
  global_stores:
    - id: "workflow-context"
      storage_type: "session"
      data_structure:
        current_workflow: "string"
        current_step: "string"
        context_data: "dict"
        navigation_history: "list"
        user_role: "string"
