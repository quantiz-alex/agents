# Design System — Centralizado
# Referenciado por todas as skills de frontend (skill07, skill09, skill10)

version: "1.1.0"
last_updated: "2026-06-18"

colors:
  # Sidebar — light clean (branding dinâmico via .build/project.json)
  sidebar_bg: "#ffffff"           # branco — separado do page_bg por border-right
  sidebar_border: "#e2e8f0"       # slate-200
  sidebar_text: "#4b5563"         # gray-600 (inativo)
  sidebar_active_bg: "{primary}14" # 8% opacity da cor primária (gerado pelo frontend-builder)
  sidebar_active_text: "{primary}" # cor primária do cliente (gerado pelo frontend-builder)
  sidebar_footer: "#9ca3af"       # gray-400 — discreto
  
  # Page
  page_bg: "#f8fafc"              # slate-50
  
  # Cards
  card_bg: "#ffffff"
  card_border: "#e2e8f0"          # slate-200
  
  # Typography
  heading: "#1e293b"
  body_text: "#374151"
  muted: "#6b7280"
  
  # Semantic
  primary: "#3b82f6"              # blue-500
  success: "#10b981"              # green-500
  warning: "#f59e0b"              # amber-500
  danger: "#ef4444"               # red-500
  info: "#06b6d4"                 # cyan-500
  secondary: "#6b7280"            # gray-500

typography:
  font_family: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  
  sizes:
    xs: "0.7rem"
    sm: "0.875rem"
    base: "1rem"
    lg: "1.125rem"
    xl: "1.25rem"
    "2xl": "1.5rem"
    "3xl": "1.875rem"
    "4xl": "2.25rem"
  
  weights:
    normal: 400
    medium: 500
    semibold: 600
    bold: 700

spacing:
  # Bootstrap spacing scale (rem)
  0: "0"
  1: "0.25rem"    # 4px
  2: "0.5rem"     # 8px
  3: "1rem"       # 16px
  4: "1.5rem"     # 24px
  5: "3rem"       # 48px

layout:
  sidebar:
    width: "240px"
    position: "fixed"
    z_index: 100
    
  content:
    margin_left: "240px"  # quando sidebar está visível
    min_height: "100vh"
    
  page_wrapper:
    padding: "1rem 1.5rem"  # py-3 px-4
    background: "#f8fafc"
    min_height: "100vh"

components:
  card:
    className: "shadow-sm border-0 mb-3"
    background: "#ffffff"
    border_radius: "0.375rem"  # rounded
    
  card_header:
    className: "bg-white border-bottom fw-semibold"
    padding: "0.75rem 1rem"
    font_size: "0.875rem"
    
  card_body:
    padding: "1rem"
    
  kpi_card:
    className: "shadow-sm border-0 border-start border-4 mb-3 h-100"
    border_colors:
      primary: "border-primary"
      success: "border-success"
      warning: "border-warning"
      danger: "border-danger"
      info: "border-info"
    
  filter_card:
    className: "shadow-sm border-0 mb-3"
    body_className: "py-2"
    row_className: "g-2 align-items-end"
    
  button:
    primary:
      color: "primary"
      className: "w-100"
    secondary:
      color: "secondary"
      className: ""
    
  badge:
    success: "success"
    warning: "warning"
    danger: "danger"
    secondary: "secondary"
    info: "info"

grid:
  ag_grid:
    theme: "ag-theme-alpine"
    height: "500px"
    
    default_col_def:
      resizable: true
      sortable: true
      filter: true
      floating_filter: true
      suppress_menu: true
      
    dash_grid_options:
      pagination: true
      pagination_page_size: 20
      pagination_page_size_selector: [10, 20, 50, 100]
      animate_rows: true
      row_height: 44
      header_height: 44
      row_selection: "multiple"
      
    csv_export:
      file_name_pattern: "<page>_export.csv"

charts:
  plotly:
    template: "plotly_white"
    paper_bgcolor: "rgba(0,0,0,0)"
    plot_bgcolor: "rgba(0,0,0,0)"
    height: 300
    
    margin:
      l: 20
      r: 20
      t: 40
      b: 20
      
    font:
      family: "system-ui, sans-serif"
      size: 12
      color: "#374151"
      
    config:
      display_mode_bar: false

forms:
  input:
    className: "form-control"
    
  select:
    className: "form-select"
    
  textarea:
    className: "form-control"
    rows: 3
    
  label:
    className: "form-label small text-muted"

naming_conventions:
  ids:
    page_grid: "<page>-grid"
    page_button_filter: "<page>-btn-filtrar"
    page_filter_field: "<page>-filtro-<campo>"
    page_filter_period: "<page>-filtro-periodo"
    page_chart: "<page>-chart-<tipo>"
    page_kpis_row: "<page>-kpis-row"
    page_button_action: "<page>-btn-<acao>"
    
  files:
    page: "<page>_page.py"
    components: "<page>_components.py"
    queries: "<page>_queries.py"
    callbacks: "<page>_callbacks.py"

restrictions:
  # Regras obrigatórias
  - "NUNCA usar dbc.Container como raiz do layout()"
  - "NUNCA usar dbc.Navbar dentro de páginas"
  - "SEMPRE usar html.Div com className='page-wrapper' como raiz"
  - "SEMPRE aplicar tipagem Python em todas as funções"
  - "NUNCA usar inline styles para cores (usar className ou design system)"
  - "SEMPRE usar IDs no padrão <page>-<component>"
  - "Página de login NÃO usa sidebar (fullscreen)"
  - "Fundo da página SEMPRE #f8fafc via style inline"

best_practices:
  - "Usar mb-3 para espaçamento vertical entre cards"
  - "Usar py-2, px-3 do Bootstrap para padding interno"
  - "KPI cards com borda lateral colorida (border-start border-4)"
  - "Filtros em card compacto no topo da página"
  - "AG Grid com floatingFilter ativo"
  - "Gráficos Plotly sem background (transparente)"
  - "Badges de status com cores semânticas"
  - "Botão filtrar com className='w-100' para ocupar coluna"
