entities:
  usuarios:
    table: usuarios
    fields:
      - {name: id, type: bigint, nullable: false, primary_key: true}
      - {name: nome, type: varchar(100), nullable: false}
      - {name: email, type: varchar(150), nullable: false}
      - {name: senha_hash, type: varchar(255), nullable: false}
      - {name: role, type: varchar(30), nullable: false}
      - {name: ativo, type: bit, nullable: false}
      - {name: created_at, type: datetime2, nullable: false}
      - {name: updated_at, type: datetime2, nullable: false}
    indexes:
      - {fields: [email], unique: true}

  produtos:
    table: produtos
    fields:
      - {name: id, type: bigint, nullable: false, primary_key: true}
      - {name: sku, type: varchar(50), nullable: false}
      - {name: descricao, type: nvarchar(200), nullable: false}
      - {name: familia, type: varchar(100), nullable: false}
      - {name: embalagem, type: varchar(100), nullable: true}
      - {name: classificacao, type: varchar(20), nullable: true}
      - {name: canal, type: varchar(100), nullable: true}
      - {name: regiao, type: varchar(100), nullable: true}
      - {name: preco_atual, type: decimal(15,4), nullable: true}
      - {name: ativo, type: bit, nullable: false}
      - {name: created_at, type: datetime2, nullable: false}
      - {name: updated_at, type: datetime2, nullable: false}
    indexes:
      - {fields: [sku], unique: true}
      - {fields: [familia, canal], unique: false}

  parametros_tributarios:
    table: parametros_tributarios
    fields:
      - {name: id, type: bigint, nullable: false, primary_key: true}
      - {name: ano_vigencia, type: int, nullable: false}
      - {name: regime, type: varchar(20), nullable: false}
      - {name: aliquota_ibs, type: decimal(5,4), nullable: false}
      - {name: aliquota_cbs, type: decimal(5,4), nullable: false}
      - {name: aliquota_icms, type: decimal(5,4), nullable: false}
      - {name: aliquota_pis, type: decimal(5,4), nullable: false}
      - {name: aliquota_cofins, type: decimal(5,4), nullable: false}
      - {name: aliquota_is, type: decimal(5,4), nullable: false}
      - {name: credito_pis_cofins, type: decimal(5,4), nullable: true}
      - {name: debito_icms, type: decimal(5,4), nullable: true}
      - {name: ativo, type: bit, nullable: false}
      - {name: usuario_id, type: bigint, nullable: false, foreign_key: {table: usuarios, field: id}}
      - {name: created_at, type: datetime2, nullable: false}
      - {name: updated_at, type: datetime2, nullable: false}
    indexes:
      - {fields: [ano_vigencia, regime], unique: false}
      - {fields: [ativo], unique: false}

  margens_cadeia:
    table: margens_cadeia
    fields:
      - {name: id, type: bigint, nullable: false, primary_key: true}
      - {name: familia, type: varchar(100), nullable: false}
      - {name: canal, type: varchar(100), nullable: false}
      - {name: margem_industria, type: decimal(5,4), nullable: false}
      - {name: margem_distribuidor, type: decimal(5,4), nullable: false}
      - {name: margem_varejo, type: decimal(5,4), nullable: false}
      - {name: price_index, type: decimal(10,4), nullable: false}
      - {name: relatividade, type: decimal(10,4), nullable: false}
      - {name: vigencia_inicio, type: date, nullable: false}
      - {name: vigencia_fim, type: date, nullable: true}
      - {name: created_at, type: datetime2, nullable: false}
      - {name: updated_at, type: datetime2, nullable: false}
    indexes:
      - {fields: [familia, canal], unique: false}

  importacoes_base:
    table: importacoes_base
    fields:
      - {name: id, type: bigint, nullable: false, primary_key: true}
      - {name: fonte, type: varchar(50), nullable: false}
      - {name: nome_arquivo, type: varchar(255), nullable: false}
      - {name: data_importacao, type: datetime2, nullable: false}
      - {name: usuario_id, type: bigint, nullable: false, foreign_key: {table: usuarios, field: id}}
      - {name: total_linhas, type: int, nullable: true}
      - {name: status, type: varchar(20), nullable: false}
      - {name: hash_arquivo, type: varchar(64), nullable: false}
      - {name: observacao, type: nvarchar(500), nullable: true}
      - {name: created_at, type: datetime2, nullable: false}
      - {name: updated_at, type: datetime2, nullable: false}
    indexes:
      - {fields: [usuario_id], unique: false}
      - {fields: [fonte, data_importacao], unique: false}

  listas_preco:
    table: listas_preco
    fields:
      - {name: id, type: bigint, nullable: false, primary_key: true}
      - {name: descricao, type: nvarchar(200), nullable: false}
      - {name: data_geracao, type: datetime2, nullable: false}
      - {name: usuario_id, type: bigint, nullable: false, foreign_key: {table: usuarios, field: id}}
      - {name: parametro_tributario_id, type: bigint, nullable: false, foreign_key: {table: parametros_tributarios, field: id}}
      - {name: status, type: varchar(30), nullable: false}
      - {name: total_skus, type: int, nullable: true}
      - {name: pct_dentro_cap, type: decimal(5,2), nullable: true}
      - {name: aprovado_por, type: bigint, nullable: true, foreign_key: {table: usuarios, field: id}}
      - {name: data_aprovacao, type: datetime2, nullable: true}
      - {name: created_at, type: datetime2, nullable: false}
      - {name: updated_at, type: datetime2, nullable: false}
    indexes:
      - {fields: [usuario_id], unique: false}
      - {fields: [parametro_tributario_id], unique: false}
      - {fields: [status], unique: false}

  listas_preco_itens:
    table: listas_preco_itens
    fields:
      - {name: id, type: bigint, nullable: false, primary_key: true}
      - {name: lista_preco_id, type: bigint, nullable: false, foreign_key: {table: listas_preco, field: id}}
      - {name: produto_id, type: bigint, nullable: false, foreign_key: {table: produtos, field: id}}
      - {name: ptc_sell_out, type: decimal(15,4), nullable: false}
      - {name: margem_cadeia_pct, type: decimal(5,4), nullable: false}
      - {name: sell_in_nf, type: decimal(15,4), nullable: false}
      - {name: sell_in_niv, type: decimal(15,4), nullable: false}
      - {name: custo_aquisicao, type: decimal(15,4), nullable: true}
      - {name: markup, type: decimal(5,4), nullable: true}
      - {name: cap_aplicado, type: bit, nullable: false}
      - {name: variacao_pct, type: decimal(8,4), nullable: true}
      - {name: created_at, type: datetime2, nullable: false}
      - {name: updated_at, type: datetime2, nullable: false}
    indexes:
      - {fields: [lista_preco_id], unique: false}
      - {fields: [produto_id], unique: false}
      - {fields: [lista_preco_id, produto_id], unique: false}

  cenarios_simulacao:
    table: cenarios_simulacao
    fields:
      - {name: id, type: bigint, nullable: false, primary_key: true}
      - {name: descricao, type: nvarchar(200), nullable: false}
      - {name: tipo_cenario, type: varchar(20), nullable: false}
      - {name: lista_preco_id, type: bigint, nullable: false, foreign_key: {table: listas_preco, field: id}}
      - {name: parametro_tributario_id, type: bigint, nullable: false, foreign_key: {table: parametros_tributarios, field: id}}
      - {name: data_simulacao, type: datetime2, nullable: false}
      - {name: usuario_id, type: bigint, nullable: false, foreign_key: {table: usuarios, field: id}}
      - {name: delta_volume_pct, type: decimal(8,4), nullable: true}
      - {name: delta_receita_niv, type: decimal(15,2), nullable: true}
      - {name: delta_margem_industria, type: decimal(15,2), nullable: true}
      - {name: created_at, type: datetime2, nullable: false}
      - {name: updated_at, type: datetime2, nullable: false}
    indexes:
      - {fields: [lista_preco_id], unique: false}
      - {fields: [parametro_tributario_id], unique: false}
      - {fields: [usuario_id], unique: false}

  cenarios_simulacao_itens:
    table: cenarios_simulacao_itens
    fields:
      - {name: id, type: bigint, nullable: false, primary_key: true}
      - {name: cenario_id, type: bigint, nullable: false, foreign_key: {table: cenarios_simulacao, field: id}}
      - {name: produto_id, type: bigint, nullable: false, foreign_key: {table: produtos, field: id}}
      - {name: volume_simulado, type: decimal(15,2), nullable: true}
      - {name: receita_niv_simulada, type: decimal(15,4), nullable: true}
      - {name: margem_industria, type: decimal(15,4), nullable: true}
      - {name: margem_distribuidor, type: decimal(15,4), nullable: true}
      - {name: margem_varejo, type: decimal(15,4), nullable: true}
      - {name: created_at, type: datetime2, nullable: false}
      - {name: updated_at, type: datetime2, nullable: false}
    indexes:
      - {fields: [cenario_id], unique: false}
      - {fields: [produto_id], unique: false}

relationships:
  - {from: importacoes_base, to: usuarios, type: one_to_many}
  - {from: parametros_tributarios, to: usuarios, type: one_to_many}
  - {from: listas_preco, to: usuarios, type: one_to_many}
  - {from: listas_preco, to: parametros_tributarios, type: one_to_many}
  - {from: listas_preco_itens, to: listas_preco, type: one_to_many}
  - {from: listas_preco_itens, to: produtos, type: one_to_many}
  - {from: cenarios_simulacao, to: listas_preco, type: one_to_many}
  - {from: cenarios_simulacao, to: parametros_tributarios, type: one_to_many}
  - {from: cenarios_simulacao, to: usuarios, type: one_to_many}
  - {from: cenarios_simulacao_itens, to: cenarios_simulacao, type: one_to_many}
  - {from: cenarios_simulacao_itens, to: produtos, type: one_to_many}

enums:
  FonteImportacao:
    values: [NielsenRetail, NielsenScantrack, PrecosERP, PL, Cadastros, DePara]
  StatusImportacao:
    values: [Sucesso, Erro, Processando]
  RegimeTributario:
    values: [Legado, Reforma]
  ClassificacaoProduto:
    values: [Capitao, MainOffender, Seguidor]
  StatusListaPreco:
    values: [Gerada, PendenteAprovacao, Aprovada, Rejeitada, Arquivada]
  TipoCenario:
    values: [MantemMargem, MantemPPC]
  RoleUsuario:
    values: [admin, gestor_pricing, analista_pricing]
