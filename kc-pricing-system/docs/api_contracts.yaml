base_url: /api/v1
auth:
  type: Bearer
  token: JWT
  header: Authorization

endpoints:

  # ─── Auth ─────────────────────────────────────────────────────────────────
  - resource: auth
    path: /auth/login
    method: POST
    auth_required: false
    description: Autenticar usuário e retornar JWT
    request_body:
      content_type: application/json
      schema:
        email: {type: string, required: true}
        password: {type: string, required: true}
    responses:
      200:
        description: Login bem-sucedido
        schema:
          access_token: {type: string}
          token_type: {type: string, example: bearer}
          expires_in: {type: integer, description: Segundos até expiração}
      401:
        description: Credenciais inválidas

  - resource: auth
    path: /auth/refresh
    method: POST
    auth_required: false
    description: Renovar token JWT antes da expiração
    request_body:
      content_type: application/json
      schema:
        refresh_token: {type: string, required: true}
    responses:
      200:
        description: Token renovado
        schema:
          access_token: {type: string}
          token_type: {type: string}
      401:
        description: Token inválido ou expirado

  # ─── Usuarios ─────────────────────────────────────────────────────────────
  - resource: usuarios
    path: /usuarios
    method: GET
    auth_required: true
    description: Listar usuários com paginação
    query_params:
      skip: {type: integer, default: 0}
      limit: {type: integer, default: 100}
      role: {type: string, required: false}
      ativo: {type: boolean, required: false}
    responses:
      200:
        description: Lista de usuários
        schema:
          items: [{id, nome, email, role, ativo, created_at}]
          total: integer

  - resource: usuarios
    path: /usuarios/{id}
    method: GET
    auth_required: true
    description: Obter usuário por ID
    path_params:
      id: {type: integer}
    responses:
      200: {description: Usuário encontrado}
      404: {description: Usuário não encontrado}

  - resource: usuarios
    path: /usuarios
    method: POST
    auth_required: true
    description: Criar novo usuário (somente admin)
    request_body:
      content_type: application/json
      schema:
        nome: {type: string, required: true, max_length: 100}
        email: {type: string, required: true, max_length: 150}
        senha: {type: string, required: true}
        role: {type: string, required: true, enum: [admin, gestor_pricing, analista_pricing]}
        ativo: {type: boolean, default: true}
    responses:
      201: {description: Usuário criado}
      422: {description: Dados inválidos}
      409: {description: Email já cadastrado}

  - resource: usuarios
    path: /usuarios/{id}
    method: PUT
    auth_required: true
    description: Atualizar usuário (somente admin)
    path_params:
      id: {type: integer}
    request_body:
      content_type: application/json
      schema:
        nome: {type: string, required: false}
        role: {type: string, required: false}
        ativo: {type: boolean, required: false}
    responses:
      200: {description: Usuário atualizado}
      404: {description: Usuário não encontrado}
      422: {description: Dados inválidos}

  - resource: usuarios
    path: /usuarios/{id}
    method: DELETE
    auth_required: true
    description: Desativar usuário (soft delete via ativo=false — somente admin)
    path_params:
      id: {type: integer}
    responses:
      204: {description: Usuário desativado}
      404: {description: Usuário não encontrado}

  # ─── Produtos ─────────────────────────────────────────────────────────────
  - resource: produtos
    path: /produtos
    method: GET
    auth_required: true
    description: Listar produtos com paginação e filtros
    query_params:
      skip: {type: integer, default: 0}
      limit: {type: integer, default: 100}
      familia: {type: string, required: false}
      canal: {type: string, required: false}
      classificacao: {type: string, required: false}
      ativo: {type: boolean, required: false}
    responses:
      200: {description: Lista de produtos}

  - resource: produtos
    path: /produtos/{id}
    method: GET
    auth_required: true
    description: Obter produto por ID
    path_params:
      id: {type: integer}
    responses:
      200: {description: Produto encontrado}
      404: {description: Produto não encontrado}

  - resource: produtos
    path: /produtos
    method: POST
    auth_required: true
    description: Criar produto
    request_body:
      content_type: application/json
      schema:
        sku: {type: string, required: true, max_length: 50}
        descricao: {type: string, required: true, max_length: 200}
        familia: {type: string, required: true, max_length: 100}
        embalagem: {type: string, required: false}
        classificacao: {type: string, required: false, enum: [Capitao, MainOffender, Seguidor]}
        canal: {type: string, required: false}
        regiao: {type: string, required: false}
        preco_atual: {type: number, required: false}
        ativo: {type: boolean, default: true}
    responses:
      201: {description: Produto criado}
      422: {description: Dados inválidos}
      409: {description: SKU já cadastrado}

  - resource: produtos
    path: /produtos/{id}
    method: PUT
    auth_required: true
    description: Atualizar produto
    path_params:
      id: {type: integer}
    responses:
      200: {description: Produto atualizado}
      404: {description: Produto não encontrado}

  - resource: produtos
    path: /produtos/{id}
    method: DELETE
    auth_required: true
    description: Desativar produto (soft delete via ativo=false)
    path_params:
      id: {type: integer}
    responses:
      204: {description: Produto desativado}
      404: {description: Produto não encontrado}

  # ─── Parametros Tributarios ────────────────────────────────────────────────
  - resource: parametros-tributarios
    path: /parametros-tributarios
    method: GET
    auth_required: true
    description: Listar parâmetros tributários
    query_params:
      skip: {type: integer, default: 0}
      limit: {type: integer, default: 100}
      ano_vigencia: {type: integer, required: false}
      regime: {type: string, required: false}
      ativo: {type: boolean, required: false}
    responses:
      200: {description: Lista de parâmetros tributários}

  - resource: parametros-tributarios
    path: /parametros-tributarios/{id}
    method: GET
    auth_required: true
    description: Obter parâmetro tributário por ID
    path_params:
      id: {type: integer}
    responses:
      200: {description: Parâmetro encontrado}
      404: {description: Parâmetro não encontrado}

  - resource: parametros-tributarios
    path: /parametros-tributarios
    method: POST
    auth_required: true
    description: Criar parâmetro tributário (não sobrescreve histórico)
    request_body:
      content_type: application/json
      schema:
        ano_vigencia: {type: integer, required: true}
        regime: {type: string, required: true, enum: [Legado, Reforma]}
        aliquota_ibs: {type: number, required: true}
        aliquota_cbs: {type: number, required: true}
        aliquota_icms: {type: number, required: true}
        aliquota_pis: {type: number, required: true}
        aliquota_cofins: {type: number, required: true}
        aliquota_is: {type: number, required: true}
        credito_pis_cofins: {type: number, required: false}
        debito_icms: {type: number, required: false}
        ativo: {type: boolean, default: false}
    responses:
      201: {description: Parâmetro criado}
      422: {description: Dados inválidos}

  - resource: parametros-tributarios
    path: /parametros-tributarios/{id}
    method: PUT
    auth_required: true
    description: Atualizar parâmetro tributário (cria nova versão)
    path_params:
      id: {type: integer}
    responses:
      200: {description: Parâmetro atualizado}
      404: {description: Parâmetro não encontrado}

  - resource: parametros-tributarios
    path: /parametros-tributarios/{id}
    method: DELETE
    auth_required: true
    description: Desativar parâmetro tributário (soft delete via ativo=false)
    path_params:
      id: {type: integer}
    responses:
      204: {description: Parâmetro desativado}
      404: {description: Parâmetro não encontrado}

  # ─── Margens Cadeia ────────────────────────────────────────────────────────
  - resource: margens-cadeia
    path: /margens-cadeia
    method: GET
    auth_required: true
    description: Listar margens da cadeia
    query_params:
      skip: {type: integer, default: 0}
      limit: {type: integer, default: 100}
      familia: {type: string, required: false}
      canal: {type: string, required: false}
    responses:
      200: {description: Lista de margens da cadeia}

  - resource: margens-cadeia
    path: /margens-cadeia/{id}
    method: GET
    auth_required: true
    description: Obter margem da cadeia por ID
    path_params:
      id: {type: integer}
    responses:
      200: {description: Margem encontrada}
      404: {description: Margem não encontrada}

  - resource: margens-cadeia
    path: /margens-cadeia
    method: POST
    auth_required: true
    description: Criar margem da cadeia
    request_body:
      content_type: application/json
      schema:
        familia: {type: string, required: true}
        canal: {type: string, required: true}
        margem_industria: {type: number, required: true}
        margem_distribuidor: {type: number, required: true}
        margem_varejo: {type: number, required: true}
        price_index: {type: number, required: true}
        relatividade: {type: number, required: true}
        vigencia_inicio: {type: string, format: date, required: true}
        vigencia_fim: {type: string, format: date, required: false}
    responses:
      201: {description: Margem criada}
      422: {description: Dados inválidos}

  - resource: margens-cadeia
    path: /margens-cadeia/{id}
    method: PUT
    auth_required: true
    description: Atualizar margem da cadeia
    path_params:
      id: {type: integer}
    responses:
      200: {description: Margem atualizada}
      404: {description: Margem não encontrada}

  - resource: margens-cadeia
    path: /margens-cadeia/{id}
    method: DELETE
    auth_required: true
    description: Excluir margem da cadeia
    path_params:
      id: {type: integer}
    responses:
      204: {description: Margem excluída}
      404: {description: Margem não encontrada}

  # ─── Importacoes Base ──────────────────────────────────────────────────────
  - resource: importacoes-base
    path: /importacoes-base
    method: GET
    auth_required: true
    description: Listar importações de base com paginação e filtros
    query_params:
      skip: {type: integer, default: 0}
      limit: {type: integer, default: 100}
      fonte: {type: string, required: false}
      status: {type: string, required: false}
    responses:
      200: {description: Lista de importações}

  - resource: importacoes-base
    path: /importacoes-base/{id}
    method: GET
    auth_required: true
    description: Obter importação por ID
    path_params:
      id: {type: integer}
    responses:
      200: {description: Importação encontrada}
      404: {description: Importação não encontrada}

  - resource: importacoes-base
    path: /importacoes-base
    method: POST
    auth_required: true
    description: Registrar nova importação de base (upload de arquivo)
    request_body:
      content_type: multipart/form-data
      schema:
        fonte: {type: string, required: true, enum: [NielsenRetail, NielsenScantrack, PrecosERP, PL, Cadastros, DePara]}
        arquivo: {type: file, required: true, accept: ".xlsx,.xls"}
        observacao: {type: string, required: false}
    responses:
      201: {description: Importação registrada}
      422: {description: Arquivo inválido ou fonte não suportada}

  - resource: importacoes-base
    path: /importacoes-base/{id}
    method: PUT
    auth_required: true
    description: Atualizar metadados de importação
    path_params:
      id: {type: integer}
    responses:
      200: {description: Importação atualizada}
      404: {description: Importação não encontrada}

  - resource: importacoes-base
    path: /importacoes-base/{id}
    method: DELETE
    auth_required: true
    description: Remover registro de importação
    path_params:
      id: {type: integer}
    responses:
      204: {description: Importação removida}
      404: {description: Importação não encontrada}

  # ─── Listas Preco ──────────────────────────────────────────────────────────
  - resource: listas-preco
    path: /listas-preco
    method: GET
    auth_required: true
    description: Listar listas de preço
    query_params:
      skip: {type: integer, default: 0}
      limit: {type: integer, default: 100}
      status: {type: string, required: false}
    responses:
      200: {description: Lista de listas de preço}

  - resource: listas-preco
    path: /listas-preco/{id}
    method: GET
    auth_required: true
    description: Obter lista de preço por ID
    path_params:
      id: {type: integer}
    responses:
      200: {description: Lista encontrada}
      404: {description: Lista não encontrada}

  - resource: listas-preco
    path: /listas-preco
    method: POST
    auth_required: true
    description: Criar e executar nova lista de preços Sell In
    request_body:
      content_type: application/json
      schema:
        descricao: {type: string, required: true}
        parametro_tributario_id: {type: integer, required: true}
    responses:
      201: {description: Lista criada e gerada}
      422: {description: Parâmetros insuficientes para geração}

  - resource: listas-preco
    path: /listas-preco/{id}
    method: PUT
    auth_required: true
    description: Atualizar status da lista (ex: enviar para aprovação, aprovar, rejeitar)
    path_params:
      id: {type: integer}
    responses:
      200: {description: Lista atualizada}
      404: {description: Lista não encontrada}

  - resource: listas-preco
    path: /listas-preco/{id}
    method: DELETE
    auth_required: true
    description: Arquivar lista de preço (soft delete via status=Arquivada)
    path_params:
      id: {type: integer}
    responses:
      204: {description: Lista arquivada}
      404: {description: Lista não encontrada}

  # ─── Listas Preco Itens ────────────────────────────────────────────────────
  - resource: listas-preco-itens
    path: /listas-preco-itens
    method: GET
    auth_required: true
    description: Listar itens de lista de preço
    query_params:
      skip: {type: integer, default: 0}
      limit: {type: integer, default: 500}
      lista_preco_id: {type: integer, required: false}
      produto_id: {type: integer, required: false}
      cap_aplicado: {type: boolean, required: false}
    responses:
      200: {description: Lista de itens}

  - resource: listas-preco-itens
    path: /listas-preco-itens/{id}
    method: GET
    auth_required: true
    description: Obter item de lista de preço por ID (cascata de formação)
    path_params:
      id: {type: integer}
    responses:
      200: {description: Item encontrado}
      404: {description: Item não encontrado}

  - resource: listas-preco-itens
    path: /listas-preco-itens
    method: POST
    auth_required: true
    description: Inserir item individual em lista de preço
    request_body:
      content_type: application/json
      schema:
        lista_preco_id: {type: integer, required: true}
        produto_id: {type: integer, required: true}
        ptc_sell_out: {type: number, required: true}
        margem_cadeia_pct: {type: number, required: true}
        sell_in_nf: {type: number, required: true}
        sell_in_niv: {type: number, required: true}
        custo_aquisicao: {type: number, required: false}
        markup: {type: number, required: false}
        cap_aplicado: {type: boolean, required: true}
        variacao_pct: {type: number, required: false}
    responses:
      201: {description: Item criado}
      422: {description: Dados inválidos}

  - resource: listas-preco-itens
    path: /listas-preco-itens/{id}
    method: PUT
    auth_required: true
    description: Atualizar item de lista de preço
    path_params:
      id: {type: integer}
    responses:
      200: {description: Item atualizado}
      404: {description: Item não encontrado}

  - resource: listas-preco-itens
    path: /listas-preco-itens/{id}
    method: DELETE
    auth_required: true
    description: Excluir item de lista de preço
    path_params:
      id: {type: integer}
    responses:
      204: {description: Item excluído}
      404: {description: Item não encontrado}

  # ─── Cenarios Simulacao ────────────────────────────────────────────────────
  - resource: cenarios-simulacao
    path: /cenarios-simulacao
    method: GET
    auth_required: true
    description: Listar cenários de simulação
    query_params:
      skip: {type: integer, default: 0}
      limit: {type: integer, default: 100}
      tipo_cenario: {type: string, required: false}
      lista_preco_id: {type: integer, required: false}
    responses:
      200: {description: Lista de cenários}

  - resource: cenarios-simulacao
    path: /cenarios-simulacao/{id}
    method: GET
    auth_required: true
    description: Obter cenário de simulação por ID
    path_params:
      id: {type: integer}
    responses:
      200: {description: Cenário encontrado}
      404: {description: Cenário não encontrado}

  - resource: cenarios-simulacao
    path: /cenarios-simulacao
    method: POST
    auth_required: true
    description: Criar e executar cenário de simulação
    request_body:
      content_type: application/json
      schema:
        descricao: {type: string, required: true}
        tipo_cenario: {type: string, required: true, enum: [MantemMargem, MantemPPC]}
        lista_preco_id: {type: integer, required: true}
        parametro_tributario_id: {type: integer, required: true}
    responses:
      201: {description: Cenário criado}
      422: {description: Dados inválidos}

  - resource: cenarios-simulacao
    path: /cenarios-simulacao/{id}
    method: PUT
    auth_required: true
    description: Atualizar cenário de simulação
    path_params:
      id: {type: integer}
    responses:
      200: {description: Cenário atualizado}
      404: {description: Cenário não encontrado}

  - resource: cenarios-simulacao
    path: /cenarios-simulacao/{id}
    method: DELETE
    auth_required: true
    description: Excluir cenário de simulação
    path_params:
      id: {type: integer}
    responses:
      204: {description: Cenário excluído}
      404: {description: Cenário não encontrado}

  # ─── Cenarios Simulacao Itens ──────────────────────────────────────────────
  - resource: cenarios-simulacao-itens
    path: /cenarios-simulacao-itens
    method: GET
    auth_required: true
    description: Listar itens de cenário de simulação
    query_params:
      skip: {type: integer, default: 0}
      limit: {type: integer, default: 500}
      cenario_id: {type: integer, required: false}
      produto_id: {type: integer, required: false}
    responses:
      200: {description: Lista de itens do cenário}

  - resource: cenarios-simulacao-itens
    path: /cenarios-simulacao-itens/{id}
    method: GET
    auth_required: true
    description: Obter item de cenário por ID
    path_params:
      id: {type: integer}
    responses:
      200: {description: Item encontrado}
      404: {description: Item não encontrado}

  - resource: cenarios-simulacao-itens
    path: /cenarios-simulacao-itens
    method: POST
    auth_required: true
    description: Inserir item de simulação
    request_body:
      content_type: application/json
      schema:
        cenario_id: {type: integer, required: true}
        produto_id: {type: integer, required: true}
        volume_simulado: {type: number, required: false}
        receita_niv_simulada: {type: number, required: false}
        margem_industria: {type: number, required: false}
        margem_distribuidor: {type: number, required: false}
        margem_varejo: {type: number, required: false}
    responses:
      201: {description: Item criado}
      422: {description: Dados inválidos}

  - resource: cenarios-simulacao-itens
    path: /cenarios-simulacao-itens/{id}
    method: PUT
    auth_required: true
    description: Atualizar item de cenário
    path_params:
      id: {type: integer}
    responses:
      200: {description: Item atualizado}
      404: {description: Item não encontrado}

  - resource: cenarios-simulacao-itens
    path: /cenarios-simulacao-itens/{id}
    method: DELETE
    auth_required: true
    description: Excluir item de cenário
    path_params:
      id: {type: integer}
    responses:
      204: {description: Item excluído}
      404: {description: Item não encontrado}
