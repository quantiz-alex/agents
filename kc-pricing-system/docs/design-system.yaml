colors:
  page: "#f8fafc"
  sidebar_bg: "#ffffff"
  sidebar_border: "#e2e8f0"
  sidebar_text: "#4b5563"
  primary: "#1045C8"
  primary_light: "#1045C814"
  success: "#10b981"
  warning: "#f59e0b"
  danger: "#ef4444"
  info: "#06b6d4"
  heading: "#1e293b"
  body_text: "#374151"
  muted: "#6b7280"
  border: "#e2e8f0"
  white: "#ffffff"

typography:
  font_family: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  sizes:
    xs: "0.7rem"
    sm: "0.75rem"
    base: "0.875rem"
    md: "1rem"
    lg: "1.125rem"
    xl: "1.25rem"
    "2xl": "1.5rem"
    "3xl": "1.875rem"
    "4xl": "2.25rem"
  weights:
    normal: 400
    medium: 500
    semibold: 600
    bold: 700

spacing:
  "0": "0"
  "1": "0.25rem"
  "2": "0.5rem"
  "3": "1rem"
  "4": "1.5rem"
  "5": "3rem"

layout:
  sidebar_width: "240px"
  content_margin_left: "240px"
  content_full_margin_left: "0"
  page_padding_x: "px-4"
  page_padding_y: "py-3"

components:
  card:
    className: "shadow-sm border-0 mb-3"
  card_header:
    className: "bg-white border-bottom fw-semibold"
  kpi_card:
    className: "shadow-sm border-0 border-start border-4 mb-3 h-100"
    colors: [primary, success, warning, danger, info]
  filter_card:
    className: "shadow-sm border-0 mb-3"
    body_className: "py-2"
    row_className: "g-2 align-items-end"
  button_primary:
    color: "primary"
    className: "w-100"
  badge:
    style: "text + semantic color"

ag_grid:
  theme: "ag-theme-alpine"
  floating_filter: true
  suppress_menu: true
  row_height: 44
  pagination_page_size: 20
  height: "500px"
  default_col_def:
    sortable: true
    resizable: true
    filter: true

plotly:
  template: "plotly_white"
  paper_bgcolor: "rgba(0,0,0,0)"
  plot_bgcolor: "rgba(0,0,0,0)"
  height: 300
  margin:
    l: 20
    r: 20
    t: 40
    b: 20
  font:
    family: "system-ui, sans-serif"
    size: 12
    color: "#374151"
  color_sequence:
    - "#1045C8"
    - "#10b981"
    - "#f59e0b"
    - "#ef4444"
    - "#06b6d4"
    - "#8b5cf6"
    - "#ec4899"

id_conventions:
  grid: "<page>-grid"
  btn_filtrar: "<page>-btn-filtrar"
  filtro: "<page>-filtro-<campo>"
  chart: "<page>-chart-<tipo>"
  kpis_row: "<page>-kpis-row"
  btn_acao: "<page>-btn-<acao>"
  modal: "<page>-modal-<nome>"
  toast: "<page>-toast-<nome>"

naming:
  pages_folder: "frontend/pages/<page>/"
  files:
    - "<page>_queries.py"
    - "<page>_components.py"
    - "<page>_page.py"
    - "<page>_callbacks.py"

restrictions:
  - "NUNCA usar dbc.Container como raiz de página"
  - "NUNCA usar matplotlib, seaborn, bokeh na UI"
  - "NUNCA usar HTML/CSS/JS em arquivos separados"
  - "NUNCA usar dcc.Markdown com HTML embutido como substituto de componentes"
  - "NUNCA usar dash.page_container — substituído por render_page_content callback"
  - "NUNCA duplicar Output('url','pathname') fora de guard_routes"

branding:
  primary: "#1045C8"
  logo: "kc-pricing-system/assets/logo.png"
  display_name: "KC Pricing"
  footer: "Desenvolvido por / Quantiz Pricing Solution"
